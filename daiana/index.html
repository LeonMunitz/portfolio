<!DOCTYPE html>
<html lang="es" class="bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión de Servicios • Daiana Souza</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="min-h-screen pb-16 flex flex-col font-sans">

  <!-- Header Fijo -->
  <header class="sticky top-0 z-30 bg-slate-900/90 backdrop-blur-md border-b border-slate-800 px-4 py-3 shadow-md">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2.5">
        <div class="w-8 h-8 rounded-lg bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-sm">
          DS
        </div>
        <div>
          <h1 class="text-sm font-bold text-white leading-tight">Daiana Souza</h1>
          <p class="text-[11px] text-slate-400">Coordinación Operativa</p>
        </div>
      </div>
      <span class="inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
        <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
        En Vivo
      </span>
    </div>
  </header>

  <!-- Contenedor Principal Móvil -->
  <main class="max-w-md mx-auto w-full px-4 pt-4 flex-grow">

    <!-- Filtros de Origen -->
    <div class="flex items-center gap-2 mb-4 p-1 bg-slate-900 rounded-xl border border-slate-800 text-xs">
      <button onclick="filtrar('todos')" id="btn-todos" class="flex-1 py-1.5 rounded-lg font-semibold bg-blue-600 text-white transition-all">
        Todos
      </button>
      <button onclick="filtrar('particular')" id="btn-particular" class="flex-1 py-1.5 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">
        Particulares
      </button>
      <button onclick="filtrar('arreglatodo')" id="btn-arreglatodo" class="flex-1 py-1.5 rounded-lg font-semibold text-slate-400 hover:text-white transition-all">
        ArreglaTodo
      </button>
    </div>

    <!-- Lista de Servicios -->
    <div id="lista-servicios" class="space-y-3.5">
      <div class="p-6 text-center text-slate-400 text-xs">Cargando agenda...</div>
    </div>

  </main>

  <script>
    let servicios = [];
    let filtroActual = 'todos';

    async function cargarServicios() {
      try {
        const resp = await fetch('servicios.json?t=' + Date.now());
        servicios = await resp.json();
        renderizar();
      } catch (e) {
        document.getElementById('lista-servicios').innerHTML = 
          '<div class="p-4 bg-red-500/10 border border-red-500/20 rounded-xl text-red-400 text-xs text-center">Error al conectar con la agenda.</div>';
      }
    }

    function filtrar(tipo) {
      filtroActual = tipo;
      ['todos', 'particular', 'arreglatodo'].forEach(t => {
        const btn = document.getElementById('btn-' + t);
        if (t === tipo) {
          btn.className = 'flex-1 py-1.5 rounded-lg font-semibold bg-blue-600 text-white transition-all shadow-sm';
        } else {
          btn.className = 'flex-1 py-1.5 rounded-lg font-semibold text-slate-400 hover:text-white transition-all';
        }
      });
      renderizar();
    }

    function renderizar() {
      const contenedor = document.getElementById('lista-servicios');
      const filtrados = servicios.filter(s => {
        if (filtroActual === 'todos') return true;
        return s.origen === filtroActual;
      });

      if (filtrados.length === 0) {
        contenedor.innerHTML = '<div class="p-8 text-center text-slate-500 text-xs">No hay servicios en esta sección.</div>';
        return;
      }

      contenedor.innerHTML = filtrados.map(s => {
        const esArreglaTodo = s.origen === 'arreglatodo';
        const badgeOrigen = esArreglaTodo
          ? '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20">ArreglaTodo #' + (s.id_externo || '') + '</span>'
          : '<span class="px-2 py-0.5 rounded-md text-[10px] font-bold bg-blue-500/10 text-blue-400 border border-blue-500/20">Particular</span>';

        const msgChica = encodeURIComponent(
          "Hola " + (s.funcionaria_nombre || 'compañera') + ", te paso los datos de tu servicio:\n\n" +
          "📍 Dirección: " + s.direccion + " (" + s.zona_nombre + ")\n" +
          "⏰ Horario: " + s.fecha_servicio + " a las " + s.hora_servicio + " hs (" + s.duracion_hs + " hs)\n" +
          "📦 Llevar: " + (s.adicionales || 'Equipo habitual') + "\n" +
          "👤 Cliente: " + s.cliente_nombre
        );

        const msgCobro = encodeURIComponent(
          "Hola " + s.cliente_nombre + ", te escribimos de parte de Daiana Souza para agradecerte por recibirnos.\n\n" +
          "El saldo del servicio de hoy es de $" + s.precio_total + " UYU.\n" +
          "Podés abonarlo por transferencia BROU / Prex o en efectivo.\n\n" +
          "¡Muchas gracias por la confianza!"
        );

        return `
          <div class="bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-sm hover:border-slate-700 transition-all">
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-2">
                <span class="font-mono text-xs font-bold text-white">${s.id}</span>
                ${badgeOrigen}
              </div>
              <span class="text-xs font-semibold text-emerald-400 flex items-center gap-1">
                <i data-lucide="clock" class="w-3.5 h-3.5"></i>
                ${s.hora_servicio} hs
              </span>
            </div>

            <div class="mb-3">
              <h2 class="text-sm font-bold text-white mb-0.5">${s.cliente_nombre}</h2>
              <p class="text-xs text-slate-300 flex items-start gap-1">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 text-slate-500 shrink-0 mt-0.5"></i>
                <span>${s.direccion}</span>
              </p>
              <div class="mt-1 flex items-center gap-2 text-[11px] text-slate-400">
                <span class="px-1.5 py-0.5 rounded bg-slate-800 border border-slate-700/60">${s.zona_nombre}</span>
                <span>• ${s.duracion_hs} hs</span>
                ${s.adicionales ? '<span>• ' + s.adicionales + '</span>' : ''}
              </div>
            </div>

            <div class="pt-2.5 border-t border-slate-800/80 flex items-center justify-between text-xs mb-3">
              <div class="flex items-center gap-1 text-slate-400">
                <i data-lucide="user-check" class="w-3.5 h-3.5 text-blue-400"></i>
                <span class="font-medium text-slate-200">${s.funcionaria_nombre || 'Por Asignar'}</span>
              </div>
              <div>
                ${esArreglaTodo 
                  ? '<span class="text-[11px] text-amber-400 font-semibold">Liquidación ArreglaTodo</span>' 
                  : '<span class="font-bold text-white">$' + s.precio_total + ' UYU</span> <span class="text-[10px] text-slate-400">(' + s.medio_pago + ')</span>'
                }
              </div>
            </div>

            <!-- Botones de Acción Rápida -->
            <div class="grid grid-cols-2 gap-2 pt-1">
              <a href="https://wa.me/?text=${msgChica}" target="_blank" class="flex items-center justify-center gap-1.5 py-2 px-2.5 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 text-emerald-300 border border-emerald-500/30 font-semibold text-xs transition-all text-center">
                <i data-lucide="send" class="w-3.5 h-3.5"></i>
                <span>A Funcionaria</span>
              </a>

              ${esArreglaTodo 
                ? '<div class="flex items-center justify-center py-2 px-2.5 rounded-xl bg-slate-800/50 text-slate-500 text-[11px] font-medium border border-slate-800">Cobra ArreglaTodo</div>'
                : `<a href="https://wa.me/?text=${msgCobro}" target="_blank" class="flex items-center justify-center gap-1.5 py-2 px-2.5 rounded-xl bg-blue-600/20 hover:bg-blue-600/30 text-blue-300 border border-blue-500/30 font-semibold text-xs transition-all text-center">
                    <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
                    <span>Cobro Cliente</span>
                  </a>`
              }
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    cargarServicios();
  </script>
</body>
</html>
